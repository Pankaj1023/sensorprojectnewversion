model_selection:
  model:

    Random Forest:
      search_param_grid:
        n_estimators:
          - 100
          - 200
        max_depth:
          - 5
          - 10
          - null
        min_samples_split:
          - 2
          - 5

    Gradient Boosting:
      search_param_grid:
        n_estimators:
          - 100
          - 200
        learning_rate:
          - 0.01
          - 0.1
        max_depth:
          - 3
          - 5

    XGBoost:
      search_param_grid:
        n_estimators:
          - 100
          - 200
        learning_rate:
          - 0.01
          - 0.1
        max_depth:
          - 3
          - 5

    SVC:
      search_param_grid:
        C:
          - 0.1
          - 1
          - 10
        kernel:
          - linear
          - rbf
        gamma:
          - scale
          - auto